<!DOCTYPE html>
<html>
<head>
    <title>Pengaturan Tabel Lengkap</title>
</head>
<body>
    <h2>Penggabungan Sel (Colspan & Rowspan)</h2>
    <table border="1" cellpadding="8" cellspacing="0" width="80%" align="center">
        <tr bgcolor="lightblue">
            <th rowspan="2">No</th>
            <th colspan="2">Informasi Mahasiswa</th>
            <th rowspan="2">Program Studi</th>
        </tr>
        <tr bgcolor="lightblue">
            <th>NIM</th>
            <th>Nama Lengkap</th>
        </tr>
        <tr>
            <td align="center" valign="middle">1</td>
            <td>25552021026</td>
            <td>Imelya Aisya Putri</td>
            <td align="center">Teknik Informatika</td>
        </tr>
        <tr>
            <td align="center" valign="middle">2</td>
            <td>25552021027</td>
            <td>Budi Santoso</td>
            <td align="center">Teknik Informatika</td>
        </tr>
    </table>
</body>
</html>
