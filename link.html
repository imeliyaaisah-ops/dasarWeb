<!DOCTYPE html>
<html>
<head>
    <title>Belajar Membuat Link</title>
</head>
<body>
    <h2>Praktikum Membuat Link</h2>

    <p>1. Link ke halaman internal (file di komputer):</p>
    <a href="hello.html">Buka Halaman Hello World</a>

    <br><br>

    <p>2. Link ke halaman eksternal (website luar):</p>
    <a href="https://www.google.com" target="_blank">Buka Google di Tab Baru</a>
</body>
</html>
