<!DOCTYPE html>
<html>
<head>
    <title>Macam-Macam Link</title>
</head>
<body>
    <h2 id="TOP">Praktikum Macam-Macam Hyperlink</h2>
    
    <p>1. Link Relatif (ke file lokal): <a href="hello.html">Buka Hello World</a></p>
    <p>2. Link Absolut (ke website luar): <a href="https://www.google.com" target="_blank">Buka Google (Tab Baru)</a></p>
    <p>3. Link Kirim Email: <a href="mailto:contoh@gmail.com">Kirim Email Ke Kami</a></p>
    
    <div style="margin-top: 600px;">
        <p>Konten di bagian bawah halaman...</p>
        <p>4. Link Anchor (Kembali ke Atas): <a href="#TOP">Kembali ke Atas Halaman</a></p>
    </div>
</body>
</html>
