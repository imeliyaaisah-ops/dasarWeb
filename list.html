<!DOCTYPE html>
<html>
<head>
    <title>Membuat List</title>
</head>
<body>
    <h3>Ordered List (Daftar Terurut)</h3>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h3>Unordered List (Daftar Tak Terurut)</h3>
    <ul>
        <li>Kopi</li>
        <li>Teh</li>
        <li>Susu</li>
    </ul>

    <h3>Description List (Daftar Definisi)</h3>
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
    </dl>
</body>
</html>
